name: Migrate

# Applies the SQL migrations to the remote Supabase projects (plan §12, AC43).
#
# SAFETY RULES (security review REV-8 of T2; do not weaken):
#   - This workflow ONLY runs `supabase db push`, which applies pending files of
#     `supabase/migrations/`. It NEVER runs seeds (`--include-seed` is forbidden) and NEVER runs
#     `supabase db reset --linked` or any reset: the seeds create accounts with a KNOWN access code
#     (fake data for local/CI) and must never reach a remote project.
#   - Migrations must be additive (plan §12); a destructive change needs its own reviewed plan.
#   - Secrets are used ONLY by the `push` (production) and `workflow_dispatch` (staging) triggers,
#     never by `pull_request`: in a public repository a PR may change this very file.
#   - Production is gated by the `production` GitHub environment (required reviewer = approval).
#   - REQUIRED REPOSITORY SETTING: the environments `production` and `staging` must have
#     "Deployment branches" = `main` only. The `if` on the job is a second barrier, not a substitute.
#   - Secrets are step-level `env`, so `npm ci` and its lifecycle scripts never see them.
#   - Ordering: this runs in parallel with the Vercel deploy of the same merge, so the new code may
#     briefly run before the migration. Migrations MUST be additive and backward compatible with
#     the previous code (plan §12).
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  # Manual run, staging only (a preview/PR with migrations is checked on staging by hand).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: db push (${{ github.event_name == 'push' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment: ${{ github.event_name == 'push' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Supabase CLI is the devDependency pinned in package-lock.json (no third-party action).
      - run: npm ci
      # Environment-scoped secrets (Settings > Environments > staging / production), step level.
      - name: Link the remote project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Pending migrations (dry run)
        run: npx supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Never add --include-seed here, and never replace this step with `db reset --linked`.
      - name: Apply migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
